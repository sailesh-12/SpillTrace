# SIH26143 — Oil Spill Investigation System configuration.
# Every threshold and weight used by the pipeline lives here.
# Paths are relative to the project root.

mode: live                  # live = real external data only (tests use their own fixtures)

segmentation:
  model_path: models/best_oil_spill_deeplabv3_resnet34.pth
  encoder_name: resnet34
  in_channels: 3
  classes: 1
  tile_size: 256            # model was trained on native 256x256 tiles (no resize)
  tile_overlap: 32          # overlap for sliding-window inference on larger scenes
  threshold: 0.5            # sigmoid(logit) > threshold  => oil pixel
  min_component_area_pixels: 100
  min_component_area_m2: 20000   # physical minimum slick area for georeferenced scenes (0.02 km2)
  morphology_kernel: 3      # 0 disables morphological opening/closing
  device: auto              # auto | cuda | cpu
  # Preprocessing verified from training notebook (cell 16):
  #   PIL .convert("RGB") -> float32 / 255 -> CHW. NO mean/std normalization.
  # For raw GeoTIFF backscatter (not 8-bit PNG) we must map to 0..255 first:
  geotiff_scaling:
    to_db: true             # linear sigma0 -> dB if values look linear
    low_percentile: 2
    high_percentile: 98

geospatial:
  # Georeferencing sidecar: <image>.geo.json next to a PNG/JPG, or pass --geo
  sidecar_suffix: .geo.json
  output_crs: EPSG:4326

sentinel1:
  provider: planetary_computer   # Microsoft Planetary Computer STAC, anonymous (no key)
  default_resolution_m: 10       # native GRDH spacing: keeps speckle statistics close to the SOS training tiles
  max_aoi_deg: 1.0
  normalization:                 # sar/sentinel1.sos_normalize; values CALIBRATED by scripts/calibrate_radiometry.py:
    window_km: 10                #   clean real sea (Skagen, 8 m/s): 0.02 % flagged (was 15 % with bg 130 / 50)
    percentile: 60               #   implanted -6 dB slicks: 100 % recall, -3 dB: ~98 %
    target_bg: 150
    target_std: 40

environment:
  mode: auto                # auto: real forcing, else SYNTHETIC Indian-waters climatology (labelled) | real | synthetic
  provider: open_meteo      # open_meteo (live, no key) | netcdf (CMEMS/HYCOM/ERA5 files you downloaded)
  current_files: []
  wind_files: []
  open_meteo:
    current_step_deg: 0.125 # marine model is ~0.083 deg; 0.125 keeps meso-scale flow at ~35% fewer API calls
    wind_step_deg: 0.25     # ERA5 is 0.25 deg
    margin_deg: 0.1
    reach_speed_ms: 0.5     # sizes the forcing domain: slick can move at most this fast (checked by coverage test)

drift:
  model: OpenOil            # OpenOil | OceanDrift (fallback if OpenOil unavailable)
  particles: 500            # per ensemble member (spec dev value 100; production 2000)
  timestep_seconds: -1800     # 30 min: well below forcing resolution (hourly, ~0.1 deg); halves run time
  output_timestep_seconds: 3600
  release_offsets_hours: [0, 0.5, 1, 3, 6, 12, 24, 36, 48]   # 0-3 h cover fresh (ship-attached) discharges
  detached_min_offset_h: 1.0   # slick without a ship-trail pattern: release assumed >= this long before image
  ensemble_runs: 6
  perturbation:
    wind_drift_factor_range: [0.02, 0.04]  # fraction of 10 m wind applied to surface oil
    current_uncertainty_ms: 0.05          # OpenDrift drift:current_uncertainty (std, m/s)
    wind_uncertainty_ms: 1.0              # OpenDrift drift:wind_uncertainty (std, m/s)
    horizontal_diffusivity_m2s: 10.0
  oil_type: UNKNOWN
  oil_model_assumption: GENERIC MEDIUM CRUDE   # used only if oil_type is UNKNOWN
  probability_grid_resolution_m: 1000
  kde_bandwidth_m: 1500
  region_levels: {high: 0.50, medium: 0.80, low: 0.95}   # highest-density mass fractions
  forward:
    enabled: true
    hours: 24
    particles: 500

ais:
  mode: auto                # auto (real if available, else SYNTHETIC) | real (never synthetic) | synthetic (always)
  real_provider: auto       # auto | gfw (Global Fishing Watch, Indian waters, needs GFW_API_TOKEN) | dma (Danish waters) | local
  synthetic:                # used when mode=synthetic, or mode=auto and no real AIS is available (SIH26143 permits this)
    fallback: true
    vessels: 10             # total synthetic vessels incl. scenario vessels (capped at 10)
    scenario: true          # add planted release vessel + nearest-vessel trap + outside-window vessel (roles in synthetic_truth.json)
    gap_rate_per_day: 2.0   # AIS coverage-gap episodes per vessel per day (x1.5 offshore)
    seed: 0
  cache_dir: data/ais/cache
  thin_seconds: 60          # DMA reports every few seconds; keep <= 1 fix/min/vessel (no positions invented)
  files: []
  column_map: default       # for provider: local -> default | marinecadastre | dma
  search_margin_km: 40
  time_margin_hours: 6
  max_speed_knots: 45       # fixes implying faster motion are dropped as impossible
  gap_threshold_minutes: 30
  corridor_buffer_km: 10
  max_source_distance_km: 20
  max_time_difference_hours: 12
  near_region_km: 5         # "near source" radius for behaviour features

scoring:
  weights:                  # prototype heuristic, NOT calibrated; normalised by their sum
    spatial: 0.25
    temporal: 0.25
    trajectory: 0.15
    sar_attached: 0.15      # AIS vessel matched to a SAR target touching the slick at acquisition time
    vessel_type: 0.07
    behavior: 0.08
    ais_continuity: 0.05
  spatial_scale_km: 5.0     # score = exp(-d / scale)
  temporal_scale_hours: 4.0
  trajectory_scale_km: 3.0
  vessel_type_relevance:
    tanker: 1.0
    cargo: 0.7
    bulk_carrier: 0.7
    container: 0.7
    tug: 0.5
    passenger: 0.5
    fishing: 0.4
    other: 0.4
    unknown: 0.5
  max_candidates: 10

sar_ship_detection:
  enabled: true
  cfar_guard_px: 4
  cfar_background_px: 12
  cfar_k: 5.0               # 8-bit uploads only: pixel > mean + k*std of background ring
  point_target_db: 10.0     # Sentinel-1/synthetic scenes: cluster > +10 dB above local sea (unclipped dB anomaly)
  point_target_min_px: 2
  min_pixels: 3
  max_pixels: 400
  match_distance_km: 1.5
  match_time_minutes: 30
  coast_exclusion_px: 8

lookalike:
  low_wind_ms: 3.0
  high_wind_ms: 12.0
  ship_link_km: 1.0
  elongated: 4.0
  strong_contrast_db: 2.0
  weak_contrast_db: 1.0
  fetch_wind: true          # ERA5 wind at acquisition (Open-Meteo) for triage

storage:
  backend: file             # file | postgis
  output_dir: outputs
  postgis_dsn: postgresql://sih:sih@localhost:5432/sih26143

impact:                     # novelty: severity index, shoreline threat, response plan, intercepts, evidence seal
  enabled: true
  weights: {size: 0.20, coast: 0.15, beaching: 0.25, sensitivity: 0.25, persistence: 0.15}
  thickness_um: {low: 0.3, central: 5.0, high: 50.0}   # Bonn Agreement appearance codes (planning range)
  oil_density_t_m3: 0.9
  beach_buffer_km: 0.5
  site_path_buffer_km: 15.0
  max_extrapolation_hours: 240.0
